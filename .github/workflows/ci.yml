name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore EventoWebNotificacoes.csproj
      - run: dotnet build EventoWebNotificacoes.csproj -c Release --no-restore

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish linux-x64 single-file
        run: >
          dotnet publish EventoWebNotificacoes.csproj -c Release -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -o publish
      - name: Rename binary
        run: mv publish/EventoWebNotificacoes publish/eventoweb-notificacoes-linux-x64
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" publish/eventoweb-notificacoes-linux-x64 \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --generate-notes
